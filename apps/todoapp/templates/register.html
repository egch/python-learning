{% include 'layout.html' %}

<div class="container">
    <div class="card">
        <div class="card-header">
            Register
        </div>
        <div class="card-body">
            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="registerForm">Email</label>
                        <input type="text" class="form-control" name="email" required>
                    </div>

                    <div class="form-group col-md-6">
                        <label for="registerForm">Username</label>
                        <input type="text" class="form-control" name="username" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="registerForm">First Name</label>
                        <input type="text" class="form-control" name="firstname" required>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="registerForm">Last Name</label>
                        <input type="text" class="form-control" name="lastname" required>
                    </div>

                </div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="registerForm">Role</label>
                        <input type="text" class="form-control" name="role" autocomplete="role" required>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="registerForm">Phone Number</label>
                        <input type="text" class="form-control" name="phone_number" autocomplete="phone_number"
                               required>
                    </div>
                </div>


                <div class="form-group">
                    <label for="registerForm">Password</label>
                    <input type="password" class="form-control" name="password" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <label for="registerForm">Verify Password</label>
                    <input type="text" class="form-control" name="password2" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary">Sign in</button>
            </form>
        </div>
        <div class="card-footer text-muted">
            <a href="/auth/login-page">Already have an account?</a>
        </div>
    </div>
</div>
